name: Friends Zone Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name friends_zone .

      - name: Add location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          if 'ACCESS_FINE_LOCATION' not in s:
              s = s.replace(marker, marker + perms)
          p.write_text(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=FZ_SUPABASE_URL=${{ secrets.FZ_SUPABASE_URL }} \
            --dart-define=FZ_SUPABASE_PUBLISHABLE_KEY=${{ secrets.FZ_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friends-zone-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

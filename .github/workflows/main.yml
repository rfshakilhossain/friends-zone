name: Friends Zone Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    working-directory: fz_app

jobs:
  build:
    name: Build Friends Zone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Check Flutter project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter project detected in fz_app"

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name friends_zone .

      - name: Add Android location permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = """
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          """.strip()

          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              if marker not in text:
                  raise SystemExit("AndroidManifest.xml marker was not found.")

              text = text.replace(
                  marker,
                  marker + "\n    " + permissions.replace("\n", "\n    ")
              )

              path.write_text(text)

          print("Android location permissions configured.")

      - name: Verify required Supabase secrets
        shell: bash
        env:
          FZ_SUPABASE_URL: ${{ secrets.FZ_SUPABASE_URL }}
          FZ_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FZ_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$FZ_SUPABASE_URL" ]; then
            echo "ERROR: FZ_SUPABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "$FZ_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERROR: FZ_SUPABASE_PUBLISHABLE_KEY secret is missing."
            exit 1
          fi

          echo "Required Supabase secrets are available."

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build release APK
        env:
          FZ_SUPABASE_URL: ${{ secrets.FZ_SUPABASE_URL }}
          FZ_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FZ_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=FZ_SUPABASE_URL="$FZ_SUPABASE_URL" \
            --dart-define=FZ_SUPABASE_PUBLISHABLE_KEY="$FZ_SUPABASE_PUBLISHABLE_KEY"

      - name: Verify APK exists
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: friends-zone-release-apk
          path: fz_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

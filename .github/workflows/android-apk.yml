name: Friends Zone Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: friends-zone-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FZ_SUPABASE_URL: ${{ secrets.FZ_SUPABASE_URL }}
      FZ_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FZ_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify Flutter toolchain
        run: |
          flutter --version
          dart --version

      - name: Generate Android host project
        run: |
          flutter create \
            --platforms=android \
            --project-name friends_zone \
            --org com.friendszone \
            --android-language kotlin \
            .

      - name: Configure Android location permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          '''

          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              if marker not in text:
                  raise SystemExit('AndroidManifest.xml manifest marker not found.')
              text = text.replace(marker, marker + permissions, 1)

          path.write_text(text)
          PY

      - name: Validate required GitHub Secrets
        shell: bash
        run: |
          test -n "$FZ_SUPABASE_URL" || { echo 'Missing FZ_SUPABASE_URL'; exit 1; }
          test -n "$FZ_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing FZ_SUPABASE_PUBLISHABLE_KEY'; exit 1; }

      - name: Validate Supabase URL format
        shell: bash
        run: |
          case "$FZ_SUPABASE_URL" in
            https://*) ;;
            *) echo 'FZ_SUPABASE_URL must start with https://'; exit 1 ;;
          esac

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define="FZ_SUPABASE_URL=$FZ_SUPABASE_URL" \
            --dart-define="FZ_SUPABASE_PUBLISHABLE_KEY=$FZ_SUPABASE_PUBLISHABLE_KEY"

      - name: Validate release APK
        shell: bash
        run: |
          APK='build/app/outputs/flutter-apk/app-release.apk'
          test -f "$APK" || { echo 'Release APK was not produced.'; exit 1; }
          test -s "$APK" || { echo 'Release APK is empty.'; exit 1; }
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: friends-zone-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

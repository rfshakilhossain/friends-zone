name: Friends Zone Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Analyze and Build Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fz_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Verify project
        run: |
          test -f pubspec.yaml
          test -d lib
          echo "Project root verified:"
          pwd
          echo "pubspec.yaml:"
          ls -la pubspec.yaml
          echo "lib:"
          ls -la lib

      - name: Generate Android platform
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --project-name friends_zone \
              .
          fi

      - name: Configure Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = """
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          """.strip()

          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              text = text.replace(
                  marker,
                  marker + "\\n    " + permissions.replace("\\n", "\\n    ")
              )

          path.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Verify dependencies
        run: flutter pub deps

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        env:
          FZ_SUPABASE_URL: ${{ secrets.FZ_SUPABASE_URL }}
          FZ_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FZ_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk \
            --release \
            --dart-define=FZ_SUPABASE_URL="$FZ_SUPABASE_URL" \
            --dart-define=FZ_SUPABASE_PUBLISHABLE_KEY="$FZ_SUPABASE_PUBLISHABLE_KEY"

      - name: Validate APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: friends-zone-release-apk
          path: fz_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
